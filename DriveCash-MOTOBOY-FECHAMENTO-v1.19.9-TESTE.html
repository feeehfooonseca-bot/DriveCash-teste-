<script id="dc-closing-v1199-script">
(()=>{
  'use strict';
  const $=s=>document.querySelector(s);
  const methods=[
    ['pix','PIX'],
    ['dinheiro','Dinheiro'],
    ['transferencia','Transferência bancária'],
    ['cartao','Cartão'],
    ['outro','Outro']
  ];
  let organizing=false, pendingOrganize=0, closingObserver=null;

  function parseBRL(text){
    const m=String(text||'').match(/R\$\s*([\d.]+(?:,\d{1,2})?)/i);
    if(!m)return 0;
    return Number(m[1].replace(/\./g,'').replace(',','.'))||0;
  }

  function formatBRL(value){
    return Number(value||0).toLocaleString('pt-BR',{
      style:'currency',
      currency:'BRL'
    });
  }

  function closingOpenAmount(row){
    const chips=[...row.querySelectorAll('.company-closing-chip')];
    const openChip=chips.find(el=>/total em aberto/i.test(el.textContent||''));
    if(openChip)return parseBRL(openChip.textContent);
    const total=row.querySelector('.company-closing-total strong');
    return parseBRL(total?.textContent||'');
  }

  function installPaymentMethod(){
    const form=$('#payment-form');
    if(!form||$('#payment-method'))return;
    const note=$('#payment-note')?.closest('.field');
    if(!note)return;

    const field=document.createElement('div');
    field.className='field dc-payment-method-field';
    field.innerHTML='<label for="payment-method">Forma de pagamento</label><select id="payment-method" required><option value="">Selecionar...</option>'+
      methods.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('')+
      '</select>';
    note.before(field);

    const hint=document.createElement('div');
    hint.className='dc-closing-payment-hint';
    hint.textContent='Escolha como o pagamento foi recebido. A forma selecionada ficará registrada junto ao recebimento.';
    field.after(hint);
  }

  function isPaidRow(row){
    if(row.classList.contains('is-paid'))return true;
    if(row.querySelector('.company-closing-paid-badge'))return true;
    return closingOpenAmount(row)<=0.0001;
  }

  function removeRedundantPaidButtons(rows){
    rows.forEach(row=>{
      [...row.querySelectorAll('button,a,[role="button"],input[type="button"],input[type="submit"]')].forEach(btn=>{
        if(btn.classList.contains('dc-closing-compact-head'))return;
        const label=(btn.textContent||btn.value||btn.getAttribute?.('aria-label')||'').trim();
        if(/marcar\s+como\s+pago/i.test(label))btn.remove();
      });
    });
  }

  function compactRow(row){
    if(!row)return;

    const name=(row.querySelector('.company-closing-head h3')?.textContent||'Empresa').trim();
    const period=(row.querySelector('.company-closing-head p')?.textContent||'').trim();
    const open=closingOpenAmount(row);

    let head=row.querySelector(':scope > .dc-closing-compact-head');
    if(!head){
      head=document.createElement('button');
      head.type='button';
      head.className='dc-closing-compact-head';
      head.setAttribute('aria-expanded','false');
      head.innerHTML=
        '<span class="dc-closing-compact-company"><strong></strong><small></small></span>'+
        '<span class="dc-closing-compact-value"><small>Total em aberto</small><strong></strong></span>'+
        '<span class="dc-closing-compact-chevron">⌄</span>';
      row.prepend(head);
    }

    const n=head.querySelector('.dc-closing-compact-company strong');
    const p=head.querySelector('.dc-closing-compact-company small');
    const v=head.querySelector('.dc-closing-compact-value strong');
    if(n && n.textContent!==name)n.textContent=name;
    if(p && p.textContent!==period)p.textContent=period;
    const valueText=formatBRL(open);
    if(v && v.textContent!==valueText)v.textContent=valueText;

    row.classList.add('dc-closing-collapsible');
    head.setAttribute('aria-expanded',row.classList.contains('dc-closing-expanded')?'true':'false');
  }

  function organizeClosing(){
    if(organizing)return;
    const list=$('#company-closing-list');
    if(!list)return;
    organizing=true;
    closingObserver?.disconnect();

    try{
      const old=list.querySelector(':scope > .dc-closing-paid-group');
      if(old){
        const body=old.querySelector('.dc-closing-paid-body');
        if(body)[...body.children].forEach(el=>list.insertBefore(el,old));
        old.remove();
      }

      list.querySelector(':scope > .dc-closing-empty')?.remove();

      const rows=[...list.children].filter(el=>el.classList?.contains('company-closing-row'));
      if(!rows.length)return;

      removeRedundantPaidButtons(rows);
      rows.forEach(compactRow);

      const paid=rows.filter(isPaidRow);
      const open=rows.filter(r=>!isPaidRow(r));

      if(!open.length){
        const empty=document.createElement('div');
        empty.className='dc-closing-empty';
        empty.textContent='Nenhuma empresa com saldo a receber neste período.';
        list.insertBefore(empty,list.firstChild);
      }

      if(paid.length){
        const details=document.createElement('details');
        details.className='dc-closing-paid-group';
        details.innerHTML=
          '<summary><span class="dc-paid-summary-copy">'+
          '<span>✓ Empresas em dia · '+paid.length+'</span>'+
          '<small>Toque para ver os períodos quitados</small>'+
          '</span><b>⌄</b></summary><div class="dc-closing-paid-body"></div>';

        const body=details.querySelector('.dc-closing-paid-body');
        paid.forEach(row=>body.append(row));
        list.append(details);
      }
    }finally{
      organizing=false;
      if(closingObserver && list){
        closingObserver.observe(list,{
          childList:true,
          subtree:true,
          characterData:true
        });
      }
      setTimeout(autoSyncBillingCentralFromClosingRows,90);
    }
  }

  function scheduleOrganize(){
    clearTimeout(pendingOrganize);
    pendingOrganize=setTimeout(organizeClosing,35);
  }

    installBillingFields();

    const saved=key?readBillingTerms()[key]:null;
    const frequency=$('#company-billing-frequency');
    const weekday=$('#company-billing-weekday');
    const rule=$('#company-billing-rule');
    const value=$('#company-billing-value');
    const status=$('#company-billing-status');

    if(saved){
      if(frequency){
        frequency.value=
          saved.frequency==='weekly' ? 'weekly' :
          saved.frequency==='biweekly' ? 'biweekly' : 'monthly';
      }
      if(weekday)weekday.value=String(saved.weekday ?? 5);
      updateBillingPeriodicityMode();
      if(rule)rule.value=saved.rule==='after_closing'?'after_closing':'fixed_day';
      updateBillingFieldMode();
      if(value)value.value=String(saved.value??'');
      if(status)status.textContent='Condição de cobrança cadastrada.';

  function saveBillingFromCompanyForm(){
    installBillingFields();
    const name=String($('#company-name')?.value||'').trim();
    const frequency=$('#company-billing-frequency')?.value||'monthly';
    const weekday=Number($('#company-billing-weekday')?.value??5);
    const rule=$('#company-billing-rule')?.value||'fixed_day';
    const rawValue=Number($('#company-billing-value')?.value||0);
    const status=$('#company-billing-status');

    if(!name)return true;

    if(!Number.isFinite(rawValue) || rawValue<=0){
      if(status)status.textContent='Informe o dia ou prazo de pagamento.';
      $('#company-billing-value')?.focus();
      return false;
    }

    if(rule==='fixed_day' && (rawValue<1 || rawValue>31)){
      if(status)status.textContent='O dia do mês deve ficar entre 1 e 31.';
      $('#company-billing-value')?.focus();
      return false;
    }

    if(rule==='after_closing' && (rawValue<1 || rawValue>90)){
      if(status)status.textContent='O prazo deve ficar entre 1 e 90 dias.';
      $('#company-billing-value')?.focus();
      return false;
    }

    const map=readBillingTerms();
    const newKey=normalizeCompanyKey(name);
    const oldKey=normalizeCompanyKey(billingOriginalCompanyName);

    if(oldKey && oldKey!==newKey)delete map[oldKey];

    map[newKey]={
      companyName:name,
      frequency:
        frequency==='weekly' ? 'weekly' :
        frequency==='biweekly' ? 'biweekly' : 'monthly',
      weekday:frequency==='weekly' ? weekday : null,
      rule:rule==='after_closing'?'after_closing':'fixed_day',
      value:Math.trunc(rawValue),
      updatedAt:new Date().toISOString()
    };

    const ok=writeBillingTerms(map);
    if(status)status.textContent=ok?'Condição de cobrança salva.':'Não foi possível salvar a condição.';
    if(ok)billingOriginalCompanyName=name;
    return ok;
  }

  const CLOSING_DATES_KEY='dc_company_closing_dates_v1';

  function localISODate(date){
    const y=date.getFullYear();
    const m=String(date.getMonth()+1).padStart(2,'0');
    const d=String(date.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+d;
  }

  function parseISODateLocal(iso){
    const parts=String(iso||'').split('-').map(Number);
    if(parts.length!==3 || parts.some(n=>!Number.isFinite(n)))return null;
    return new Date(parts[0],parts[1]-1,parts[2],12,0,0,0);
  }

  function addDaysISO(iso,days){
    const dt=parseISODateLocal(iso);
    if(!dt)return '';
    dt.setDate(dt.getDate()+Number(days||0));
    return localISODate(dt);
  }

  function formatDateBR(iso){
    const dt=parseISODateLocal(iso);
    if(!dt)return '—';
    return new Intl.DateTimeFormat('pt-BR').format(dt);
  }

  function readClosingDates(){
    try{
      const raw=localStorage.getItem(CLOSING_DATES_KEY);
      const parsed=raw?JSON.parse(raw):{};
      return parsed && typeof parsed==='object' && !Array.isArray(parsed) ? parsed : {};
    }catch(e){

    }
  }

  function writeClosingDates(map){

  function currentChargePeriod(){
    const start=String($('#charge-start')?.value||'');
    const end=String($('#charge-end')?.value||'');
    return {
      start:/^\d{4}-\d{2}-\d{2}$/.test(start)?start:'',
      end:/^\d{4}-\d{2}-\d{2}$/.test(end)?end:''
    };
  }

  function lastCompletedPeriod(term,referenceDate){
    const now=new Date(referenceDate||new Date());
    now.setHours(12,0,0,0);

    if(term?.frequency==='weekly'){
      const closingWeekday=Number.isFinite(Number(term.weekday)) ? Number(term.weekday) : 5;
      const diff=(now.getDay()-closingWeekday+7)%7;
      const end=new Date(now);
      end.setDate(end.getDate()-diff);
      const start=new Date(end);
      start.setDate(start.getDate()-6);
      return {start:localISODate(start),end:localISODate(end),frequency:'weekly'};
    }

    if(term?.frequency==='biweekly'){
      const y=now.getFullYear();
      const m=now.getMonth();
      const d=now.getDate();
      const lastDay=new Date(y,m+1,0,12).getDate();

      if(d===lastDay){
        return {
          start:localISODate(new Date(y,m,16,12)),
          end:localISODate(new Date(y,m,lastDay,12)),
          frequency:'biweekly'
        };
      }

      if(d>=15){
        return {
          start:localISODate(new Date(y,m,1,12)),
          end:localISODate(new Date(y,m,15,12)),
          frequency:'biweekly'
        };
      }

      const prevLast=new Date(y,m,0,12);
      return {
        start:localISODate(new Date(prevLast.getFullYear(),prevLast.getMonth(),16,12)),
        end:localISODate(prevLast),
        frequency:'biweekly'
      };
    }

    /* Mensal: usa o último mês calendário totalmente concluído.
       No próprio último dia do mês, o mês atual já pode ser fechado. */
    const y=now.getFullYear();
    const m=now.getMonth();
    const d=now.getDate();
    const lastDay=new Date(y,m+1,0,12).getDate();

    if(d===lastDay){
      return {
        start:localISODate(new Date(y,m,1,12)),
        end:localISODate(new Date(y,m,lastDay,12)),
        frequency:'monthly'
      };
    }

    const prevLast=new Date(y,m,0,12);
    return {
      start:localISODate(new Date(prevLast.getFullYear(),prevLast.getMonth(),1,12)),
      end:localISODate(prevLast),
      frequency:'monthly'
    };
  }

  function dueDateFromTerm(closedAt,term){
    if(term?.rule==='after_closing'){
      return addDaysISO(closedAt,Number(term.value||0));
    }

    const base=parseISODateLocal(closedAt);
    const requested=Math.max(1,Math.min(31,Number(term?.value||1)));
    let y=base.getFullYear(), m=base.getMonth();

    const makeDate=(year,month,day)=>{
      const last=new Date(year,month+1,0,12).getDate();
      return new Date(year,month,Math.min(day,last),12);
    };

    let candidate=makeDate(y,m,requested);
    if(candidate < base){
      m+=1;
      if(m>11){m=0;y+=1;}
      candidate=makeDate(y,m,requested);
    }
    return localISODate(candidate);
  }

  function monthPeriodFromValue(value){
    const m=String(value||'').match(/^(\d{4})-(\d{2})$/);
    if(!m)return null;
    const y=Number(m[1]), month=Number(m[2]);
    if(month<1 || month>12)return null;
    const last=new Date(y,month,0,12).getDate();
    return {
      start:y+'-'+String(month).padStart(2,'0')+'-01',
      end:y+'-'+String(month).padStart(2,'0')+'-'+String(last).padStart(2,'0')
    };
  }

  function periodFromClosingRow(row,term){
    if(!row)return lastCompletedPeriod(term,new Date());

    /* Prioridade 1: metadados do próprio card, quando existirem. */
    const startData=row.dataset?.periodStart || row.getAttribute?.('data-period-start');
    const endData=row.dataset?.periodEnd || row.getAttribute?.('data-period-end');
    if(/^\d{4}-\d{2}-\d{2}$/.test(startData||'') && /^\d{4}-\d{2}-\d{2}$/.test(endData||'')){
      return {start:startData,end:endData,frequency:term?.frequency||'monthly'};
    }

    /* Prioridade 2: intervalo de datas escrito no card. */
    const text=String(
      row.querySelector('.company-closing-head p')?.textContent ||
      row.querySelector('.dc-closing-compact-company small')?.textContent ||
      row.textContent || ''
    );
    const br=[...text.matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{4})/g)];
    if(br.length>=2){
      const iso=m=>m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
      return {start:iso(br[0]),end:iso(br[1]),frequency:term?.frequency||'monthly'};
    }
    const isoDates=[...text.matchAll(/(\d{4}-\d{2}-\d{2})/g)].map(m=>m[1]);
    if(isoDates.length>=2){
      return {start:isoDates[0],end:isoDates[1],frequency:term?.frequency||'monthly'};
    }

    /* Prioridade 3: período selecionado no Fechamento por Empresa.
       Evita jogar o saldo visível no mês anterior só porque o mês atual
       ainda não terminou. */
    const selected=String($('#company-closing-period')?.value||'');
    const selectedMonth=monthPeriodFromValue(selected);
    if(selectedMonth && (!term || term.frequency==='monthly')){
      return {...selectedMonth,frequency:'monthly'};
    }

    return lastCompletedPeriod(term,new Date());
  }

  function autoSyncBillingCentralFromClosingRows(scheduleAfter=true){
    const list=$('#company-closing-list');
    const allRows=list ? [...list.getElementsByClassName('company-closing-row')] : [];
    const rows=visibleOpenCompanyRows();
    const terms=readBillingTerms();
    const map=readClosingDates();
    const today=localISODate(new Date());
    let changed=false;
    const liveKeys=new Set();
    const visibleScopes=new Set();

    /* Registra o escopo de todos os cards renderizados, inclusive os quitados.
       Assim, quando uma empresa é marcada como paga, a Central de Cobranças
       consegue zerar somente aquela competência, sem tocar no histórico. */
    allRows.forEach(row=>{
      const company=companyNameFromClosingRow(row);
      const companyKey=normalizeCompanyKey(company);
      const term=terms[companyKey];
      if(!companyKey || !term)return;
      const period=periodFromClosingRow(row,term);
      if(!period?.start || !period?.end)return;
      visibleScopes.add(companyKey+'|'+period.start+'|'+period.end);
    });

    rows.forEach(row=>{
      const company=companyNameFromClosingRow(row);
      const companyKey=normalizeCompanyKey(company);
      const term=terms[companyKey];
      if(!companyKey || !term)return;

      const period=periodFromClosingRow(row,term);
      if(!period?.start || !period?.end)return;

      const key=companyKey+'|'+period.start+'|'+period.end;
      liveKeys.add(key);
      visibleScopes.add(key);
      let record=map[key];

      if(!record){
        record={
          companyName:company,
          period:period.start.slice(0,7),
          periodStart:period.start,
          periodEnd:period.end,
          closedAt:today,
          dueAt:dueDateFromTerm(today,term),
          rule:term.rule,
          value:Number(term.value||0),
          frequency:term.frequency||'monthly',
          weekday:term.frequency==='weekly' ? Number(term.weekday ?? 5) : null,
          autoGenerated:true,
          createdAt:new Date().toISOString()
        };
        changed=true;
      }

      const openAmount=openAmountFromClosingRow(row);
      if(
        !Number.isFinite(Number(record.openAmount)) ||
        Math.abs(Number(record.openAmount)-openAmount)>0.005 ||
        record.companyName!==company ||
        record.periodStart!==period.start ||
        record.periodEnd!==period.end
      ){
        record={
          ...record,
          companyName:company,
          period:period.start.slice(0,7),
          periodStart:period.start,
          periodEnd:period.end,
          openAmount,
          snapshotAt:new Date().toISOString()
        };
        changed=true;
      }

      map[key]=record;
    });

    /* Se a competência continua visível, mas não está mais entre os saldos
       abertos, ela foi quitada/zerada. Atualiza só o snapshot da Central. */
    visibleScopes.forEach(key=>{
      if(liveKeys.has(key))return;
      const record=map[key];
      if(!record || Number(record.openAmount||0)<=0.005)return;
      map[key]={
        ...record,
        openAmount:0,
        paidSnapshot:true,
        snapshotAt:new Date().toISOString()
      };
      changed=true;
    });

    if(changed)writeClosingDates(map);
    else if(scheduleAfter){
      scheduleBillingCentral();
      scheduleTodayBilling();
    }
  }

  function applyAutomaticChargePeriod(){
    const dialog=$('#charge-dialog');
    if(!dialog || !dialog.hasAttribute('open'))return false;

    const company=String($('#charge-company-name')?.textContent||'').trim();
    const companyKey=normalizeCompanyKey(company);
    if(!companyKey || /^empresa$/i.test(company))return false;

    const term=readBillingTerms()[companyKey];
    if(!term)return false;

    const period=lastCompletedPeriod(term,new Date());
    if(!period?.start || !period?.end)return false;

    const start=$('#charge-start');
    const end=$('#charge-end');
    if(start)start.value=period.start;
    if(end)end.value=period.end;

    dialog.dataset.dcAutoPeriodStart=period.start;
    dialog.dataset.dcAutoPeriodEnd=period.end;
    return true;
  }

  function renderClosingDue(){
    const dialog=$('#charge-dialog');
    if(!dialog || !dialog.hasAttribute('open'))return;

    const box=ensureChargeDueBox();
    if(!box)return;

    const company=String($('#charge-company-name')?.textContent||'').trim();
    const companyKey=normalizeCompanyKey(company);
    if(!companyKey || /^empresa$/i.test(company)){
      box.innerHTML='';
      box.style.display='none';
      return;
    }

    const term=readBillingTerms()[companyKey];
    if(!term){
      box.style.display='grid';
      box.innerHTML=
        '<div class="dc-due-title">Fechamento e vencimento</div>'+
        '<div class="dc-charge-due-note">Esta empresa ainda não possui regra de vencimento cadastrada.</div>';
      return;
    }

    const selectedPeriod=currentChargePeriod();
    if(!selectedPeriod.start || !selectedPeriod.end){
      box.style.display='grid';
      box.innerHTML=
        '<div class="dc-due-title">Fechamento e vencimento</div>'+
        '<div class="dc-charge-due-note">Defina o período da cobrança para calcular o vencimento.</div>';
      return;
    }

    const periodKey=selectedPeriod.start+'|'+selectedPeriod.end;
    const recordKey=companyKey+'|'+periodKey;
    const map=readClosingDates();
    let record=map[recordKey];

    /* Compatibilidade com versões anteriores: somente para mensal,
       reaproveita um fechamento salvo pela chave AAAA-MM quando existir. */
    if(!record && term.frequency!=='weekly' && term.frequency!=='biweekly'){
      const legacyKey=companyKey+'|'+selectedPeriod.start.slice(0,7);
      if(map[legacyKey])record=map[legacyKey];
    }

    /* Opção B: a data do fechamento é a data em que a cobrança detalhada
       é gerada pela primeira vez para aquela empresa e período concluído. */
    if(!record){
      const closedAt=localISODate(new Date());
      let dueAt='';

      dueAt=dueDateFromTerm(closedAt,term);

      record={
        companyName:company,
        period:selectedPeriod.start.slice(0,7),
        periodStart:selectedPeriod.start,
        periodEnd:selectedPeriod.end,
        closedAt,
        dueAt,
        rule:term.rule,
        value:Number(term.value||0),
        frequency:term.frequency||'monthly',
        weekday:term.frequency==='weekly' ? Number(term.weekday ?? 5) : null,
        createdAt:new Date().toISOString()
      };
      map[recordKey]=record;
      writeClosingDates(map);
    }

    const ruleText=record.rule==='after_closing'
      ? Number(record.value||0)+' dia(s) após o fechamento'
      : 'dia '+Number(record.value||0)+' do mês';

    const liveTerm=readBillingTerms()[companyKey]||term;
    const weekdayNames={
      0:'Domingo',
      1:'Segunda-feira',
      2:'Terça-feira',
      3:'Quarta-feira',
      4:'Quinta-feira',
      5:'Sexta-feira',
      6:'Sábado'
    };
    const frequencyText=
      liveTerm.frequency==='weekly'
        ? 'Semanal · '+(weekdayNames[Number(liveTerm.weekday ?? 5)]||'dia definido')
        : liveTerm.frequency==='biweekly'
          ? 'Quinzenal · 1–15 / 16–fim do mês'
          : 'Mensal';

    box.style.display='grid';
    box.innerHTML=
      '<div class="dc-due-title">Fechamento e vencimento</div>'+
      '<div class="dc-charge-due-grid">'+
        '<div class="dc-charge-due-item dc-charge-period-item"><small>Período selecionado automaticamente</small><strong>'+formatDateBR(selectedPeriod.start)+' a '+formatDateBR(selectedPeriod.end)+'</strong></div>'+
        '<div class="dc-charge-due-item"><small>Fechamento</small><strong>'+formatDateBR(record.closedAt)+'</strong></div>'+
        '<div class="dc-charge-due-item"><small>Vencimento</small><strong>'+formatDateBR(record.dueAt)+'</strong></div>'+
      '</div>'+
      '<div class="dc-charge-due-note">Periodicidade: '+frequencyText+' · Regra aplicada: '+ruleText+'. A data do fechamento fica preservada para esta competência.</div>';
  }


  let billingCentralTimer=0, billingCentralMountTimer=0, billingCentralObserver=null;


  function billingTodaySummary(){
    const records=normalizedClosingRecords().filter(record=>{
      const amount=Number.isFinite(Number(record.openAmount)) ? Number(record.openAmount) : null;
      return amount===null || amount>0.005;
    });

    const priority={overdue:0,today:1,upcoming:2};
    records.sort((a,b)=>{
      const sa=billingCentralStatus(a.dueAt);
      const sb=billingCentralStatus(b.dueAt);
      const byStatus=(priority[sa]??9)-(priority[sb]??9);
      if(byStatus!==0)return byStatus;
      const byDue=String(a.dueAt||'').localeCompare(String(b.dueAt||''));
      if(byDue!==0)return byDue;
      return String(a.companyName||'').localeCompare(String(b.companyName||''));
    });

    const counts={overdue:0,today:0,upcoming:0,total:0};
    records.forEach(record=>{
      const status=billingCentralStatus(record.dueAt);
      if(Object.prototype.hasOwnProperty.call(counts,status))counts[status]+=1;
    });
    counts.total=counts.overdue+counts.today+counts.upcoming;

    return {
      counts,
      urgent:records[0]||null
    };
  }

  function renderTodayBilling(){
    const box=installTodayBillingBox();
    if(!box)return;

    const summary=billingTodaySummary();
    const counts=summary.counts;
    const urgent=summary.urgent;

    const title=$('#dc-today-billing-title');
    const detail=$('#dc-today-billing-detail');
    const count=$('#dc-today-billing-count');
    const urgentWrap=$('#dc-today-billing-urgent');
    const company=$('#dc-today-billing-company');
    const amount=$('#dc-today-billing-amount');
    const due=$('#dc-today-billing-due');

    box.classList.remove('has-danger','has-warning');
    box.dataset.company='';
    if(count)count.textContent=String(counts.total);

    if(counts.total===0 || !urgent){
      urgentWrap?.classList.add('hidden');
      const missing=unconfiguredOpenCompanies();
      if(missing.length){
        box.classList.add('has-warning');
        if(count)count.textContent=String(missing.length);
        if(title)title.textContent=missing.length+' empresa(s) sem regra de cobrança';
        if(detail)detail.textContent='Há saldo em aberto, mas falta definir periodicidade e vencimento.';
      }else{
        if(title)title.textContent='Nenhuma cobrança pendente';
        if(detail)detail.textContent='Não há vencidas, vencendo hoje ou a vencer.';
      }
      return;
    }

    const urgentStatus=billingCentralStatus(urgent.dueAt);
    if(counts.overdue>0)box.classList.add('has-danger');
    else if(counts.today>0)box.classList.add('has-warning');

    if(title){
      title.textContent=
        counts.overdue>0 ? counts.overdue+' cobrança(s) vencida(s)' :
        counts.today>0 ? counts.today+' cobrança(s) vence(m) hoje' :
        counts.upcoming+' cobrança(s) a vencer';
    }

    const parts=[];
    if(counts.overdue)parts.push(counts.overdue+' vencida'+(counts.overdue===1?'':'s'));
    if(counts.today)parts.push(counts.today+' vence hoje');
    if(counts.upcoming)parts.push(counts.upcoming+' a vencer');
    if(detail)detail.textContent=parts.join(' · ')+'. Mais urgente:';

    urgentWrap?.classList.remove('hidden');
    if(company)company.textContent=String(urgent.companyName||'Empresa');
    if(amount){
      amount.textContent=Number.isFinite(Number(urgent.openAmount))
        ? formatBRLValue(Number(urgent.openAmount))
        : 'Valor a atualizar';
    }

    let dueText='Vencimento '+formatDateBR(urgent.dueAt);
    if(urgentStatus==='overdue')dueText='Vencida em '+formatDateBR(urgent.dueAt);
    else if(urgentStatus==='today')dueText='Vence hoje · '+formatDateBR(urgent.dueAt);
    else dueText='Vence em '+formatDateBR(urgent.dueAt);

    if(due)due.textContent=dueText+' · Toque para abrir o fechamento.';
    box.dataset.company=String(urgent.companyName||'');
  }

  function formatBRLValue(value){
    if(value===null || value===undefined || !Number.isFinite(Number(value)))return 'Atualizar';
    return Number(value).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  }

  function closingRecordPeriod(record){
    if(record?.periodStart && record?.periodEnd){
      return formatDateBR(record.periodStart)+' a '+formatDateBR(record.periodEnd);
    }
    if(record?.period && /^\d{4}-\d{2}$/.test(record.period)){
      const parts=record.period.split('-').map(Number);
      const last=new Date(parts[0],parts[1],0,12).getDate();
      return formatDateBR(record.period+'-01')+' a '+formatDateBR(record.period+'-'+String(last).padStart(2,'0'));
    }
    return 'Período não identificado';
  }

  function normalizedClosingRecords(){
    const raw=readClosingDates();
    const unique=new Map();

    Object.entries(raw).forEach(([key,record])=>{
      if(!record || typeof record!=='object' || !record.companyName || !record.dueAt)return;

      const companyKey=normalizeCompanyKey(record.companyName);
      const periodIdentity=
        record.periodStart && record.periodEnd
          ? record.periodStart+'|'+record.periodEnd
          : (record.period||key);

      const id=companyKey+'|'+periodIdentity;
      const current=unique.get(id);
      const currentStamp=String(current?.snapshotAt||current?.createdAt||'');
      const nextStamp=String(record.snapshotAt||record.createdAt||'');

      if(!current || nextStamp>=currentStamp){
        unique.set(id,{...record,_storageKey:key,_id:id});
      }
    });

    return [...unique.values()];
  }

  function billingCentralStatus(dueAt){
    const today=localISODate(new Date());
    if(dueAt<today)return 'overdue';
    if(dueAt===today)return 'today';
    return 'upcoming';
  }

  function findClosingRecordForCharge(company,start,end){
    const companyKey=normalizeCompanyKey(company);
    const raw=readClosingDates();
    const exactKey=companyKey+'|'+start+'|'+end;
    if(raw[exactKey])return {key:exactKey,record:raw[exactKey],map:raw};

    const found=Object.entries(raw).find(([key,record])=>
      normalizeCompanyKey(record?.companyName)===companyKey &&
      record?.periodStart===start &&
      record?.periodEnd===end
    );
    if(found)return {key:found[0],record:found[1],map:raw};

    const legacyKey=companyKey+'|'+String(start||'').slice(0,7);
    if(raw[legacyKey])return {key:legacyKey,record:raw[legacyKey],map:raw};
    return null;
  }

  function captureChargeSnapshot(){
    const dialog=$('#charge-dialog');
    if(!dialog || !dialog.hasAttribute('open'))return;

    const company=String($('#charge-company-name')?.textContent||'').trim();
    const period=currentChargePeriod();
    if(!company || !period.start || !period.end)return;

    const found=findClosingRecordForCharge(company,period.start,period.end);
    if(!found)return;

    const totalText=String($('#charge-total')?.textContent||'').trim();
    if(!/R\$/i.test(totalText))return;

    const openAmount=parseBRL(totalText);
    const generatedAmount=parseBRL($('#charge-period-generated')?.textContent||'');
    const periodBalance=parseBRL($('#charge-period-balance')?.textContent||'');

    const next={
      ...found.record,
      openAmount,
      generatedAmount,
      periodBalance,
      snapshotAt:new Date().toISOString()
    };

    const previous=Number(found.record?.openAmount);
    const changed=
      !Number.isFinite(previous) ||
      Math.abs(previous-openAmount)>0.005 ||
      Number(found.record?.generatedAmount||0)!==generatedAmount ||
      Number(found.record?.periodBalance||0)!==periodBalance;

    if(changed){
      found.map[found.key]=next;
      writeClosingDates(found.map);
    }
    scheduleBillingCentral();
    scheduleTodayBilling(120);
  }

<script type="module" id="dc-billing-cloud-v1199">
import { getState, updateConfig } from 'dc:js/services/state.service.js';
import { saveCloud, currentUser } from 'dc:js/services/firebase.service.js';

const TERMS_KEY='dc_company_billing_terms_v1';
const CLOSINGS_KEY='dc_company_closing_dates_v1';
const CLOUD_FIELD='billingCloudV1';

let applyingCloud=false;
let saveTimer=0;
let restoreSeen=false;
let saving=false;

function safeMap(value){
  return value && typeof value==='object' && !Array.isArray(value) ? value : {};
}

function readLocal(key){
  try{return safeMap(JSON.parse(localStorage.getItem(key)||'{}'));}
  catch{return {};}
}

function stamp(value,kind){
  const source=kind==='term'
    ? value?.updatedAt
    : (value?.snapshotAt || value?.updatedAt || value?.createdAt || value?.closedAt);
  const parsed=Date.parse(source||'');
  return Number.isFinite(parsed) ? parsed : 0;
}

function mergeMap(localMap,cloudMap,kind){
  const out={};
  const keys=new Set([...Object.keys(safeMap(localMap)),...Object.keys(safeMap(cloudMap))]);

  keys.forEach(key=>{
    const local=localMap?.[key];
    const cloud=cloudMap?.[key];

    if(local && !cloud){out[key]=local;return;}
    if(cloud && !local){out[key]=cloud;return;}
    if(!local && !cloud)return;

    const localStamp=stamp(local,kind);
    const cloudStamp=stamp(cloud,kind);

    /* Em empate, mantém os campos locais derivados (como openAmount),
       sem perder campos que possam ter vindo da nuvem. */
    out[key]=cloudStamp>localStamp
      ? {...local,...cloud}
      : {...cloud,...local};
  });

  return out;
}

function cloudClosing(record){
  if(!record || typeof record!=='object')return record;
  const {
    companyName,period,periodStart,periodEnd,closedAt,dueAt,
    rule,value,frequency,weekday,autoGenerated,createdAt,snapshotAt
  }=record;

  return {
    companyName,period,periodStart,periodEnd,closedAt,dueAt,
    rule,value,frequency,weekday,autoGenerated,createdAt,snapshotAt
  };
}

function cloudClosingMap(map){
  const out={};
  Object.entries(safeMap(map)).forEach(([key,value])=>{
    out[key]=cloudClosing(value);
  });
  return out;
}

function comparable(value){
  try{return JSON.stringify(value);}
  catch{return '';}
}

function setStatus(state,text){
  const el=document.getElementById('dc-billing-cloud-status');
  if(!el)return;
  el.dataset.state=state;
  el.textContent=text;
}

function ensureStatus(){
  if(document.getElementById('dc-billing-cloud-status'))return;
  const central=document.getElementById('dc-billing-central');
  if(!central)return;

  const p=document.createElement('p');
  p.id='dc-billing-cloud-status';
  p.className='dc-billing-cloud-status';
  p.dataset.state='pending';
  p.textContent='Cobranças · aguardando sincronização com a nuvem';
  central.append(p);
}

function writeLocalIfChanged(key,next,eventName){
  const current=readLocal(key);
  if(comparable(current)===comparable(next))return false;

  try{
    localStorage.setItem(key,JSON.stringify(next));
    window.dispatchEvent(new CustomEvent(eventName));
    return true;
  }catch(error){
    console.warn('DriveCash: não foi possível atualizar o cache local de cobrança.',error);
    return false;
  }
}

function cloudSnapshot(){

}

function buildMerged(){
  const cloud=cloudSnapshot();
  const localTerms=readLocal(TERMS_KEY);
  const localClosings=readLocal(CLOSINGS_KEY);

  const terms=mergeMap(localTerms,safeMap(cloud.terms),'term');
  const closings=mergeMap(localClosings,safeMap(cloud.closings),'closing');

  return {terms,closings,cloud};
}

function applyCloudToLocal(){

  applyingCloud=true;

    writeLocalIfChanged(CLOSINGS_KEY,closings,'drivecash:closing-dates-updated');

function cloudPayload(terms,closings,updatedAt){

    schema:1,

    closings:cloudClosingMap(closings),

async function syncNow(reason='change'){
  if(saving || applyingCloud)return;

  ensureStatus();

  if(!currentUser()){
    setStatus('pending','Cobranças · salvas neste aparelho; entre na conta para sincronizar');

  saving=true;

  try{
    const {terms,closings,cloud}=buildMerged();

    /* Primeiro aplica o que for mais novo vindo da nuvem ao cache local. */
    applyingCloud=true;

      writeLocalIfChanged(CLOSINGS_KEY,closings,'drivecash:closing-dates-updated');
    }finally{

    }

    const nextCore={
      schema:1,
      terms,
      closings:cloudClosingMap(closings)
    };

      schema:Number(cloud.schema||1),
      terms:safeMap(cloud.terms),

    if(comparable(nextCore)!==comparable(currentCore)){

      if(!ok){
        setStatus('pending','Cobranças · sincronização pendente');

          detail:{reason:'company-billing'}
        }));
        return;
      }
    }

    setStatus('synced','Cobranças · nuvem sincronizada');
    window.dispatchEvent(new CustomEvent('drivecash:billing-cloud-synced',{
      detail:{reason}
    }));
  }catch(error){
    console.warn('DriveCash: falha ao sincronizar cobranças na nuvem.',error);
    setStatus('error','Cobranças · falha ao sincronizar; os dados locais foram preservados');
    window.dispatchEvent(new CustomEvent('drivecash:sync-request',{
      detail:{reason:'company-billing'}
    }));
  }finally{
    saving=false;
  }
}

function scheduleSync(reason='change',delay=700){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>syncNow(reason),delay);
}

function restoreAndSync(){
  restoreSeen=true;
  applyCloudToLocal();
  scheduleSync('restore',450);
}

window.addEventListener('drivecash:billing-terms-updated',()=>{
  if(!applyingCloud)scheduleSync('billing-terms',750);

window.addEventListener('drivecash:closing-dates-updated',()=>{

function boot(){
  ensureStatus();

  const cloud=cloudSnapshot();
  if(cloud && Object.keys(cloud).length){
    applyCloudToLocal();
    scheduleSync('existing-cloud',500);
  }else if(currentUser()){
    /* Não envia no boot às cegas: aguarda o evento de restauração do
       Firebase para evitar substituir uma cópia remota ainda não carregada. */
    setStatus('pending','Cobranças · aguardando restauração da nuvem');
  }else{
    setStatus('pending','Cobranças · salvas neste aparelho; entre na conta para sincronizar');
  }

  /* O status é recriado caso o Financeiro seja renderizado novamente. */
  const observer=new MutationObserver(()=>{
    ensureStatus();
    if(restoreSeen && currentUser() && !saving){
      const el=document.getElementById('dc-billing-cloud-status');
      if(el && el.dataset.state==='pending')scheduleSync('remount',900);
    }
  });
  observer.observe(document.body,{childList:true,subtree:true});
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot,{once:true});
}else{
  boot();
}
