       Fechamento por Empresa. O valor visível nunca é associado ao
       "último período concluído" calculado pelo relógio. Registros antigos

    const dcCentralSyncFixed=String.raw`  function autoSyncBillingCentralFromClosingRows(scheduleAfter=true){
    const rows=visibleOpenCompanyRows();
    if(!rows.length){
      if(scheduleAfter){
        scheduleBillingCentral();
        scheduleTodayBilling();
      }
      return;
    }

    const visibleMonth=String($('#company-closing-period')?.value||'').trim();
    if(!/^\d{4}-\d{2}$/.test(visibleMonth)){
      if(scheduleAfter){
        scheduleBillingCentral();
        scheduleTodayBilling();
      }
      return;
    }

    const parts=visibleMonth.split('-').map(Number);
    const y=parts[0], m=parts[1];
    const lastDay=new Date(y,m,0,12).getDate();
    const period={
      start:visibleMonth+'-01',
      end:visibleMonth+'-'+String(lastDay).padStart(2,'0'),
      frequency:'monthly'
    };

    const terms=readBillingTerms();
    const map=readClosingDates();
    const today=localISODate(new Date());
    let changed=false;

    rows.forEach(row=>{
      const company=companyNameFromClosingRow(row);
      const companyKey=normalizeCompanyKey(company);
      const term=terms[companyKey];
      if(!companyKey || !term)return;

      const frequency=
        term.frequency==='weekly' ? 'weekly' :
        term.frequency==='biweekly' ? 'biweekly' : 'monthly';

      /* O Fechamento por Empresa exibido nesta tela é mensal. Por isso,
         somente empresas mensais podem receber automaticamente o total
         desse card. Semanal/quinzenal continuam pela cobrança detalhada. */
      if(frequency!=='monthly')return;

      const key=companyKey+'|'+period.start+'|'+period.end;
      let record=map[key];

      if(!record){
        record={
          companyName:company,
          period:visibleMonth,
          periodStart:period.start,
          periodEnd:period.end,
          closedAt:today,
          dueAt:dueDateFromTerm(today,term),
          rule:term.rule,
          value:Number(term.value||0),
          frequency:'monthly',
          weekday:null,
          autoGenerated:true,
          createdAt:new Date().toISOString()
        };
        changed=true;
      }

      const openAmount=openAmountFromClosingRow(row);
      if(
        !Number.isFinite(Number(record.openAmount)) ||
        Math.abs(Number(record.openAmount)-openAmount)>0.005 ||
        record.companyName!==company ||
        record.period!==visibleMonth ||
        record.periodStart!==period.start ||
        record.periodEnd!==period.end
      ){
        record={
          ...record,
          companyName:company,
          period:visibleMonth,
          periodStart:period.start,
          periodEnd:period.end,
          frequency:'monthly',
          weekday:null,
          openAmount,
          snapshotAt:new Date().toISOString()
        };
        changed=true;
      }

      map[key]=record;
    });

    if(changed)writeClosingDates(map);
    else if(scheduleAfter){
      scheduleBillingCentral();
      scheduleTodayBilling();
    }
  }`;

    html=html.slice(0,dcCentralSyncStartAt)+dcCentralSyncFixed+html.slice(dcCentralSyncEndAt);


    /* v1.21.2 — Na cobrança detalhada mensal, usa o mesmo mês que está
       selecionado no Fechamento por Empresa. Semanal/quinzenal mantêm a
       regra própria de último período concluído. */
    const dcApplyPeriodStart='  function applyAutomaticChargePeriod(){';
    const dcApplyPeriodEnd='\n\n  function ensureChargeDueBox(){';
    const dcApplyPeriodStartAt=html.indexOf(dcApplyPeriodStart);
    const dcApplyPeriodEndAt=dcApplyPeriodStartAt>=0 ? html.indexOf(dcApplyPeriodEnd,dcApplyPeriodStartAt) : -1;
    if(dcApplyPeriodStartAt<0 || dcApplyPeriodEndAt<0){
      throw new Error('Ponto de correção da competência detalhada não encontrado');
    }

    const dcApplyPeriodFixed=String.raw`  function applyAutomaticChargePeriod(){
    const dialog=$('#charge-dialog');
    if(!dialog || !dialog.hasAttribute('open'))return false;

    const company=String($('#charge-company-name')?.textContent||'').trim();
    const companyKey=normalizeCompanyKey(company);
    if(!companyKey || /^empresa$/i.test(company))return false;

    const term=readBillingTerms()[companyKey];
    if(!term)return false;

    let period=null;
    const frequency=
      term.frequency==='weekly' ? 'weekly' :
      term.frequency==='biweekly' ? 'biweekly' : 'monthly';
    const visibleMonth=String($('#company-closing-period')?.value||'').trim();

    if(frequency==='monthly' && /^\d{4}-\d{2}$/.test(visibleMonth)){
      const parts=visibleMonth.split('-').map(Number);
      const lastDay=new Date(parts[0],parts[1],0,12).getDate();
      period={
        start:visibleMonth+'-01',
        end:visibleMonth+'-'+String(lastDay).padStart(2,'0'),
        frequency:'monthly'
      };
    }else{
      period=lastCompletedPeriod(term,new Date());
    }

    if(!period?.start || !period?.end)return false;

    const start=$('#charge-start');
    const end=$('#charge-end');
    if(start)start.value=period.start;
    if(end)end.value=period.end;

    dialog.dataset.dcAutoPeriodStart=period.start;
    dialog.dataset.dcAutoPeriodEnd=period.end;
    return true;
  }`;

    html=html.slice(0,dcApplyPeriodStartAt)+dcApplyPeriodFixed+html.slice(dcApplyPeriodEndAt);

    /* Não apaga registros anteriores. Apenas evita exibir, ao mesmo tempo,
       um registro mensal antigo que recebeu exatamente o valor do mês atual
       pela regra defeituosa das versões anteriores. Ao selecionar o mês
       antigo, ele volta a aparecer e pode ser recalculado corretamente. */
    const dcNormalizedStart='  function normalizedClosingRecords(){';
    const dcNormalizedEnd='\n\n  function billingCentralStatus(dueAt){';
    const dcNormalizedStartAt=html.indexOf(dcNormalizedStart);
    const dcNormalizedEndAt=dcNormalizedStartAt>=0 ? html.indexOf(dcNormalizedEnd,dcNormalizedStartAt) : -1;
    if(dcNormalizedStartAt<0 || dcNormalizedEndAt<0){
      throw new Error('Ponto de correção dos registros da Central não encontrado');
    }

    const dcNormalizedFixed=String.raw`  function normalizedClosingRecords(){
    const raw=readClosingDates();
    const unique=new Map();

    Object.entries(raw).forEach(([key,record])=>{
      if(!record || typeof record!=='object' || !record.companyName || !record.dueAt)return;

      const companyKey=normalizeCompanyKey(record.companyName);
      const periodIdentity=
        record.periodStart && record.periodEnd
          ? record.periodStart+'|'+record.periodEnd
          : (record.period||key);

      const id=companyKey+'|'+periodIdentity;
      const current=unique.get(id);
      const currentStamp=String(current?.snapshotAt||current?.createdAt||'');
      const nextStamp=String(record.snapshotAt||record.createdAt||'');

      if(!current || nextStamp>=currentStamp){
        unique.set(id,{...record,_storageKey:key,_id:id});
      }
    });

    const records=[...unique.values()];
    const visibleMonth=String($('#company-closing-period')?.value||'').trim();
    if(!/^\d{4}-\d{2}$/.test(visibleMonth))return records;

    const parts=visibleMonth.split('-').map(Number);
    const lastDay=new Date(parts[0],parts[1],0,12).getDate();
    const visibleStart=visibleMonth+'-01';
    const visibleEnd=visibleMonth+'-'+String(lastDay).padStart(2,'0');
    const terms=readBillingTerms();
    const currentAmounts=new Map();

    visibleOpenCompanyRows().forEach(row=>{
      const key=normalizeCompanyKey(companyNameFromClosingRow(row));
      const amount=openAmountFromClosingRow(row);
      if(key && Number.isFinite(Number(amount)))currentAmounts.set(key,Number(amount));
    });

    return records.filter(record=>{
      const companyKey=normalizeCompanyKey(record.companyName);
      const term=terms[companyKey];
      const amount=currentAmounts.get(companyKey);
      if(!term || term.frequency==='weekly' || term.frequency==='biweekly' || !Number.isFinite(amount))return true;

      const exactCurrent=records.find(item=>
        normalizeCompanyKey(item.companyName)===companyKey &&
        item.periodStart===visibleStart &&
        item.periodEnd===visibleEnd &&
        Number.isFinite(Number(item.openAmount)) &&
        Math.abs(Number(item.openAmount)-amount)<=0.005
      );
      if(!exactCurrent || record===exactCurrent)return true;

      const oldTarget=lastCompletedPeriod(term,new Date());
      if(!oldTarget?.start || !oldTarget?.end || oldTarget.start.slice(0,7)===visibleMonth)return true;

      const contaminated=
        record.autoGenerated===true &&
        record.periodStart===oldTarget.start &&
        record.periodEnd===oldTarget.end &&
        Number.isFinite(Number(record.openAmount)) &&
        Math.abs(Number(record.openAmount)-amount)<=0.005;

      return !contaminated;
    });
  }`;

       primeira sincronização, quando billingCloudV1 ainda não existe,

    const cloud=cloudSnapshot();

    const bootPatch=`let bootstrapFallbackTimer=0;

function scheduleBootstrapFallback(delay=6000){
  clearTimeout(bootstrapFallbackTimer);
  const firstConfig=comparable(getState()?.config||{});

  bootstrapFallbackTimer=setTimeout(()=>{
    if(restoreSeen || saving || !currentUser())return;

    const cloud=cloudSnapshot();
    if(cloud && Object.keys(cloud).length){
      restoreSeen=true;
      applyCloudToLocal();
      scheduleSync('bootstrap-cloud',180);
      return;
    }

    /* Se nenhum evento de restore chegou ao módulo, confirma que a config
       permaneceu estável antes de permitir a primeira gravação. Isso evita
       sobrescrever uma restauração remota que ainda esteja chegando. */
    const secondConfig=comparable(getState()?.config||{});
    if(firstConfig===secondConfig){
      restoreSeen=true;
      setStatus('pending','Cobranças · concluindo sincronização com a nuvem…');
      scheduleSync('restore-fallback',180);
      return;
    }

    scheduleBootstrapFallback(3000);
  },delay);
}

let billingAuthTimer=0;

function waitForBillingAuth(tries=0){
  clearTimeout(billingAuthTimer);

  billingAuthTimer=setTimeout(()=>{
    ensureStatus();

    if(currentUser()){
      const cloud=cloudSnapshot();

      if(cloud && Object.keys(cloud).length){
        restoreSeen=true;
        applyCloudToLocal();
        scheduleSync('auth-ready-cloud',250);
        return;
      }

      if(restoreSeen){
        scheduleSync('auth-ready',250);
        return;
      }

      /* A autenticação acabou de ficar disponível, mas a configuração
         remota ainda pode estar chegando. Usa o fallback protegido por
         estabilidade antes da primeira gravação. */
      setStatus('pending','Cobranças · conta conectada; preparando sincronização…');
      scheduleBootstrapFallback(1800);
      return;
    }

    if(tries < 40){
      setStatus('pending','Cobranças · aguardando conexão com a conta…');
      waitForBillingAuth(tries+1);
    }else{
      setStatus('pending','Cobranças · aguardando conexão com a conta');
    }
  }, tries===0 ? 250 : 500);
}

document.addEventListener('click',event=>{
  if(!event.target.closest?.('#dc-billing-central-refresh'))return;
  if(!currentUser()){
    setStatus('pending','Cobranças · aguardando conexão com a conta…');
    waitForBillingAuth();
    return;
  }
  const cloud=cloudSnapshot();
  if(cloud && Object.keys(cloud).length){
    restoreSeen=true;
    applyCloudToLocal();
    scheduleSync('manual-refresh',120);
  }else if(!restoreSeen){
    scheduleBootstrapFallback(1800);
  }else{
    scheduleSync('manual-refresh',120);
  }
},true);

function boot(){`;
