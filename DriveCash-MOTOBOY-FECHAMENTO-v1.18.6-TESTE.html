<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DriveCash — teste v1.18.6</title>
<style>
html,body{margin:0;min-height:100%;background:#050807;color:#f4f7f5;font-family:Inter,system-ui,sans-serif}
#loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
#loader strong{display:block;color:#03ca8a;margin-bottom:8px}
</style>
</head>
<body>
<div id="loader"><div><strong>DriveCash · TESTE</strong><span>Carregando v1.18.6…</span></div></div>
<script>
(async()=>{
  const BASE='DriveCash-MOTOBOY-FECHAMENTO-EMPRESA-TESTE.html?v=base-1180';
  try{
    const response=await fetch(BASE,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();
    html=html.replace(
      'v1.18.0-cloud-test-fechamento-empresa-push-pro',
      'v1.18.6-cloud-test-fechamento-compacto-pagamento-unico'
    );

    const patch=String.raw`
<style id="dc-closing-v1186-style">
.dc-payment-method-field{margin-top:0}

/* Fechamento: o fluxo antigo "Marcar como pago" fica definitivamente oculto. */
#company-closing-list .company-closing-row > .company-closing-actions,
#company-closing-list .company-closing-row .company-closing-actions{display:none!important}

/* Cards compactos: empresa + total em aberto. */
#company-closing-list .company-closing-row.dc-closing-collapsible{
  padding:0;
  gap:0;
  overflow:hidden;
}
.dc-closing-compact-head{
  width:100%;
  border:0;
  margin:0;
  padding:14px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto 28px;
  align-items:center;
  gap:10px;
  text-align:left;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.dc-closing-compact-company{min-width:0;display:grid;gap:3px}
.dc-closing-compact-company strong{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:.88rem;
}
.dc-closing-compact-company small{
  color:var(--muted);
  font-size:.61rem;
}
.dc-closing-compact-value{
  display:grid;
  justify-items:end;
  gap:3px;
  white-space:nowrap;
}
.dc-closing-compact-value small{
  color:var(--muted);
  font-size:.5rem;
  font-weight:850;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.dc-closing-compact-value strong{
  font-size:.85rem;
  color:var(--red);
}
.company-closing-row.is-paid .dc-closing-compact-value strong,
.dc-closing-paid-body .dc-closing-compact-value strong{color:var(--green)}
.dc-closing-compact-chevron{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:999px;
  background:rgba(255,255,255,.035);
  color:var(--muted);
  font-size:1rem;
  transition:transform .16s ease;
}
.company-closing-row.dc-closing-expanded .dc-closing-compact-chevron{transform:rotate(180deg)}
.company-closing-row.dc-closing-collapsible:not(.dc-closing-expanded) > :not(.dc-closing-compact-head){
  display:none!important;
}
.company-closing-row.dc-closing-collapsible.dc-closing-expanded{
  padding-bottom:14px;
  gap:12px;
}
.company-closing-row.dc-closing-collapsible.dc-closing-expanded > :not(.dc-closing-compact-head){
  margin-left:14px;
  margin-right:14px;
}
.company-closing-row.dc-closing-collapsible.dc-closing-expanded > .company-closing-head{
  padding-top:2px;
}
.dc-closing-compact-head:active{background:rgba(255,255,255,.018)}

/* Grupo de empresas quitadas. */
.dc-closing-paid-group{
  margin-top:12px;
  border:1px solid rgba(37,226,138,.15);
  border-radius:16px;
  background:rgba(37,226,138,.025);
  overflow:hidden
}
.dc-closing-paid-group>summary{
  list-style:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 14px;
  color:var(--green);
  font-size:.72rem;
  font-weight:850;
  user-select:none
}
.dc-closing-paid-group>summary::-webkit-details-marker{display:none}
.dc-closing-paid-group>summary .dc-paid-summary-copy{display:grid;gap:2px}
.dc-closing-paid-group>summary small{color:var(--muted);font-size:.58rem;font-weight:650}
.dc-closing-paid-group>summary b{
  width:28px;height:28px;display:grid;place-items:center;border-radius:999px;
  background:rgba(37,226,138,.09);font-size:1rem;transition:transform .16s ease
}
.dc-closing-paid-group[open]>summary b{transform:rotate(180deg)}
.dc-closing-paid-body{display:grid;gap:10px;padding:0 10px 10px;border-top:1px solid rgba(255,255,255,.05)}
.dc-closing-paid-body .company-closing-row{margin-top:10px}
.dc-closing-empty{
  padding:12px 13px;border:1px dashed var(--border);border-radius:13px;
  color:var(--muted);font-size:.68rem;line-height:1.45;background:rgba(255,255,255,.015)
}
.dc-closing-payment-hint{
  margin:-2px 0 12px;padding:9px 10px;border-radius:11px;
  border:1px solid rgba(37,226,138,.14);background:rgba(37,226,138,.035);
  color:var(--muted);font-size:.62rem;line-height:1.4
}
@media(max-width:420px){
  .dc-closing-compact-head{grid-template-columns:minmax(0,1fr) auto 26px;padding:13px 12px;gap:8px}
  .dc-closing-compact-company strong{font-size:.82rem}
  .dc-closing-compact-value strong{font-size:.8rem}
}
</style>

<script id="dc-closing-v1186-script">
(()=>{
  'use strict';
  const $=s=>document.querySelector(s);
  const methods=[
    ['pix','PIX'],
    ['dinheiro','Dinheiro'],
    ['transferencia','Transferência bancária'],
    ['cartao','Cartão'],
    ['outro','Outro']
  ];
  let organizing=false, pendingOrganize=0;

  function parseBRL(text){
    const m=String(text||'').match(/R\$\s*([\d.]+(?:,\d{1,2})?)/i);
    if(!m)return 0;
    return Number(m[1].replace(/\./g,'').replace(',','.'))||0;
  }

  function formatBRL(value){
    return Number(value||0).toLocaleString('pt-BR',{
      style:'currency',
      currency:'BRL'
    });
  }

  function closingOpenAmount(row){
    const chips=[...row.querySelectorAll('.company-closing-chip')];
    const openChip=chips.find(el=>/total em aberto/i.test(el.textContent||''));
    if(openChip)return parseBRL(openChip.textContent);
    const total=row.querySelector('.company-closing-total strong');
    return parseBRL(total?.textContent||'');
  }

  function installPaymentMethod(){
    const form=$('#payment-form');
    if(!form||$('#payment-method'))return;
    const note=$('#payment-note')?.closest('.field');
    if(!note)return;

    const field=document.createElement('div');
    field.className='field dc-payment-method-field';
    field.innerHTML='<label for="payment-method">Forma de pagamento</label><select id="payment-method" required><option value="">Selecionar...</option>'+
      methods.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('')+
      '</select>';
    note.before(field);

    const hint=document.createElement('div');
    hint.className='dc-closing-payment-hint';
    hint.textContent='Escolha como o pagamento foi recebido. A forma selecionada ficará registrada junto ao recebimento.';
    field.after(hint);
  }

  function isPaidRow(row){
    if(row.classList.contains('is-paid'))return true;
    if(row.querySelector('.company-closing-paid-badge'))return true;
    return closingOpenAmount(row)<=0.0001;
  }

  function removeRedundantPaidButtons(rows){
    rows.forEach(row=>{
      [...row.querySelectorAll('button,a,[role="button"],input[type="button"],input[type="submit"]')].forEach(btn=>{
        if(btn.classList.contains('dc-closing-compact-head'))return;
        const label=(btn.textContent||btn.value||btn.getAttribute?.('aria-label')||'').trim();
        if(/marcar\s+como\s+pago/i.test(label))btn.remove();
      });
    });
  }

  function compactRow(row){
    if(!row)return;

    const name=(row.querySelector('.company-closing-head h3')?.textContent||'Empresa').trim();
    const period=(row.querySelector('.company-closing-head p')?.textContent||'').trim();
    const open=closingOpenAmount(row);

    let head=row.querySelector(':scope > .dc-closing-compact-head');
    if(!head){
      head=document.createElement('button');
      head.type='button';
      head.className='dc-closing-compact-head';
      head.setAttribute('aria-expanded','false');
      head.innerHTML=
        '<span class="dc-closing-compact-company"><strong></strong><small></small></span>'+
        '<span class="dc-closing-compact-value"><small>Total em aberto</small><strong></strong></span>'+
        '<span class="dc-closing-compact-chevron">⌄</span>';
      row.prepend(head);
    }

    const n=head.querySelector('.dc-closing-compact-company strong');
    const p=head.querySelector('.dc-closing-compact-company small');
    const v=head.querySelector('.dc-closing-compact-value strong');
    if(n && n.textContent!==name)n.textContent=name;
    if(p && p.textContent!==period)p.textContent=period;
    const valueText=formatBRL(open);
    if(v && v.textContent!==valueText)v.textContent=valueText;

    row.classList.add('dc-closing-collapsible');
    head.setAttribute('aria-expanded',row.classList.contains('dc-closing-expanded')?'true':'false');
  }

  function organizeClosing(){
    if(organizing)return;
    const list=$('#company-closing-list');
    if(!list)return;
    organizing=true;

    try{
      const old=list.querySelector(':scope > .dc-closing-paid-group');
      if(old){
        const body=old.querySelector('.dc-closing-paid-body');
        if(body)[...body.children].forEach(el=>list.insertBefore(el,old));
        old.remove();
      }

      list.querySelector(':scope > .dc-closing-empty')?.remove();

      const rows=[...list.children].filter(el=>el.classList?.contains('company-closing-row'));
      if(!rows.length)return;

      removeRedundantPaidButtons(rows);
      rows.forEach(compactRow);

      const paid=rows.filter(isPaidRow);
      const open=rows.filter(r=>!isPaidRow(r));

      if(!open.length){
        const empty=document.createElement('div');
        empty.className='dc-closing-empty';
        empty.textContent='Nenhuma empresa com saldo a receber neste período.';
        list.insertBefore(empty,list.firstChild);
      }

      if(paid.length){
        const details=document.createElement('details');
        details.className='dc-closing-paid-group';
        details.innerHTML=
          '<summary><span class="dc-paid-summary-copy">'+
          '<span>✓ Empresas em dia · '+paid.length+'</span>'+
          '<small>Toque para ver os períodos quitados</small>'+
          '</span><b>⌄</b></summary><div class="dc-closing-paid-body"></div>';

        const body=details.querySelector('.dc-closing-paid-body');
        paid.forEach(row=>body.append(row));
        list.append(details);
      }
    }finally{
      organizing=false;
    }
  }

  function scheduleOrganize(){
    clearTimeout(pendingOrganize);
    pendingOrganize=setTimeout(organizeClosing,35);
  }

  document.addEventListener('click',event=>{
    const head=event.target.closest?.('.dc-closing-compact-head');
    if(head){
      const row=head.closest('.company-closing-row');
      if(!row)return;
      const expanded=row.classList.toggle('dc-closing-expanded');
      head.setAttribute('aria-expanded',expanded?'true':'false');
      return;
    }

    const oldButton=event.target.closest?.('#company-closing-list button,#company-closing-list a,#company-closing-list [role="button"]');
    if(!oldButton)return;
    const label=(oldButton.textContent||oldButton.value||oldButton.getAttribute?.('aria-label')||'').trim();
    if(!/marcar\s+como\s+pago/i.test(label))return;
    event.preventDefault();
    event.stopImmediatePropagation();
    oldButton.remove();
  },true);

  document.addEventListener('submit',event=>{
    const form=event.target.closest?.('#payment-form');
    if(!form)return;

    installPaymentMethod();
    const method=$('#payment-method');
    if(!method?.value){
      event.preventDefault();
      event.stopImmediatePropagation();
      method?.reportValidity?.();
      return;
    }

    const label=method.options[method.selectedIndex]?.textContent||method.value;
    const note=$('#payment-note');
    if(note){
      const clean=String(note.value||'').replace(/^Forma de pagamento:\s*[^·]+(?:·\s*)?/i,'').trim();
      note.value='Forma de pagamento: '+label+(clean?' · '+clean:'');
    }

    setTimeout(scheduleOrganize,250);
  },true);

  function start(){
    installPaymentMethod();
    scheduleOrganize();

    const list=$('#company-closing-list');
    if(list){
      new MutationObserver(()=>scheduleOrganize()).observe(list,{
        childList:true,
        subtree:true,
        characterData:true
      });
    }

    $('#company-closing-period')?.addEventListener('change',()=>setTimeout(scheduleOrganize,80));
    window.addEventListener('drivecash:storage',()=>setTimeout(scheduleOrganize,100));
    window.addEventListener('drivecash:restore-complete',()=>setTimeout(scheduleOrganize,100));
    setTimeout(scheduleOrganize,400);
    [80,180,350,700,1200,2200,4000].forEach(ms=>setTimeout(scheduleOrganize,ms));
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
<\/script>`;

    html=html.replace('</body>',patch+'\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loader').innerHTML=
      '<div><strong>Não foi possível carregar o DriveCash</strong><span>Recarregue a página. Nenhum dado foi apagado.</span></div>';
    console.error('DriveCash v1.18.6 loader',err);
  }
})();
</script>
</body>
</html>
